server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    error_page 404 /404.html;

    # WordPress feed path compatibility
    location = /feed { return 301 /index.xml; }
    location = /feed/ { return 301 /index.xml; }

    # content-hashed theme assets, safe to cache immutably
    location ^~ /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri =404;
    }
    location ^~ /js/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri =404;
    }

    # long-lived caching for media and theme images
    location ^~ /wp-content/uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri =404;
    }
    location ^~ /img/ {
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/rss+xml application/xml image/svg+xml;
}
