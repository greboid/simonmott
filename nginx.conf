server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    error_page 404 /404.html;

    # WordPress feed path compatibility
    location = /feed { return 301 /index.xml; }
    location = /feed/ { return 301 /index.xml; }

    # long-lived caching for uploaded media
    location /wp-content/uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/rss+xml image/svg+xml;
}
